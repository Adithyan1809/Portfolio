<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#0f0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow blob -->
  <ellipse cx="900" cy="315" rx="400" ry="300" fill="url(#glow)"/>
  <ellipse cx="300" cy="150" rx="200" ry="150" fill="url(#glow)" opacity="0.5"/>

  <!-- Wireframe cube decoration (top right) -->
  <g stroke="#6366f1" stroke-opacity="0.2" stroke-width="1" fill="none" transform="translate(920, 60) rotate(15) scale(2.2)">
    <polygon points="30,30 70,30 70,70 30,70"/>
    <polygon points="45,15 85,15 85,55 45,55"/>
    <line x1="30" y1="30" x2="45" y2="15"/>
    <line x1="70" y1="30" x2="85" y2="15"/>
    <line x1="70" y1="70" x2="85" y2="55"/>
    <line x1="30" y1="70" x2="45" y2="55"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="195" width="4" height="60" rx="2" fill="url(#accent)"/>

  <!-- Name -->
  <text x="110" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Adithyan P.</text>

  <!-- Role -->
  <text x="110" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">AI &amp; ML Engineer · Technical Lead</text>

  <!-- Divider -->
  <rect x="110" y="325" width="500" height="1" fill="#ffffff" opacity="0.08"/>

  <!-- Pills row -->
  <!-- Python pill -->
  <rect x="110" y="348" width="100" height="30" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="160" y="368" text-anchor="middle" font-family="monospace" font-size="13" fill="#818cf8">Python</text>

  <!-- PyTorch pill -->
  <rect x="222" y="348" width="100" height="30" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="272" y="368" text-anchor="middle" font-family="monospace" font-size="13" fill="#818cf8">PyTorch</text>

  <!-- FastAPI pill -->
  <rect x="334" y="348" width="100" height="30" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="384" y="368" text-anchor="middle" font-family="monospace" font-size="13" fill="#34d399">FastAPI</text>

  <!-- Docker pill -->
  <rect x="446" y="348" width="90" height="30" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="491" y="368" text-anchor="middle" font-family="monospace" font-size="13" fill="#34d399">Docker</text>

  <!-- YOLOv8 pill -->
  <rect x="548" y="348" width="90" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="593" y="368" text-anchor="middle" font-family="monospace" font-size="13" fill="#a78bfa">YOLOv8</text>

  <!-- Stat cards -->
  <rect x="110" y="410" width="175" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="197" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#10b981">90+</text>
  <text x="197" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Live Camera Feeds</text>

  <rect x="300" y="410" width="175" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="387" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#6366f1">50K+</text>
  <text x="387" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Lines of Code</text>

  <rect x="490" y="410" width="175" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="577" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#8b5cf6">6</text>
  <text x="577" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Engineers Led</text>

  <!-- URL -->
  <text x="110" y="575" font-family="monospace" font-size="18" fill="#52525b">adithyanp.me</text>

  <!-- Open to work badge -->
  <rect x="900" y="545" width="190" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="923" cy="563" r="5" fill="#10b981"/>
  <text x="975" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">Open to Work</text>
</svg>
